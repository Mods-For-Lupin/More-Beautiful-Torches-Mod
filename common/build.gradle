plugins {
    id 'multiloader-common'
    id 'net.neoforged.moddev.legacyforge'
}

dependencies {
  compileOnly group: 'org.spongepowered', name: 'mixin', version: '0.8.5'
  implementation group: 'com.google.code.findbugs', name: 'jsr305', version: '3.0.1'
  compileOnly group: 'io.github.llamalad7', name: 'mixinextras-common', version: '0.5.4'
  annotationProcessor group: 'io.github.llamalad7', name: 'mixinextras-common', version: '0.5.4'

  compileOnly 'com.electronwill.night-config:toml:3.6.0'

  implementation 'monolib:monolib-common:1.20.1-4.1.0'
}

legacyForge {
    mcpVersion = minecraft_version
    if (file("src/main/resources/META-INF/accesstransformer.cfg").exists()) {
        accessTransformers = ["src/main/resources/META-INF/accesstransformer.cfg"]
    }
    parchment {
        minecraftVersion = parchment_minecraft
        mappingsVersion = parchment_version
    }
}

sourceSets.main.resources.srcDir 'src/generated/resources'

configurations {
    commonJava {
        canBeResolved = false
        canBeConsumed = true
    }
    commonResources {
        canBeResolved = false
        canBeConsumed = true
    }
}

artifacts {
  commonJava sourceSets.main.java.sourceDirectories.singleFile

  // resources has two srcDirs (src/main/resources and datagen output at src/generated/resources)
  // publish each dir as its own artifact; consumer do from(configurations.commonResources),
  // which unions automatically
  sourceSets.main.resources.srcDirs.each { dir -> commonResources dir }
}
