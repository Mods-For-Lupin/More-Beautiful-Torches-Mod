plugins {
    id 'multiloader-common'
    id 'net.neoforged.moddev'
}

dependencies {
  compileOnly group: 'org.spongepowered', name: 'mixin', version: '0.8.5'
  // fabric and neoforge both bundle mixinextras, so it is safe to use it in common
  compileOnly group: 'io.github.llamalad7', name: 'mixinextras-common', version: '0.3.5'
  annotationProcessor group: 'io.github.llamalad7', name: 'mixinextras-common', version: '0.3.5'

  compileOnly 'com.electronwill.night-config:toml:3.6.0'

  implementation 'monolib:monolib-common:1.21.1-4.1.0'
}

neoForge {
    neoFormVersion = neo_form_version
    // Automatically enable AccessTransformers if the file exists
    def at = file('src/main/resources/META-INF/accesstransformer.cfg')
    if (at.exists()) {
        accessTransformers.from(at.absolutePath)
    }
    parchment {
        minecraftVersion = parchment_minecraft
        mappingsVersion = parchment_version
    }
}

sourceSets.main.resources.srcDir 'src/generated/resources'

configurations {
    commonJava {
        canBeResolved = false
        canBeConsumed = true
    }
    commonResources {
        canBeResolved = false
        canBeConsumed = true
    }
}

artifacts {
    commonJava sourceSets.main.java.sourceDirectories.singleFile
    // singleFile would throw now that resources has two srcDirs (src/main/resources
    // and the datagen output at src/generated/resources) - publish each dir as its
    // own artifact instead; consumers just do from(configurations.commonResources),
    // which happily unions however many artifacts a configuration resolves to.
    sourceSets.main.resources.srcDirs.each { dir -> commonResources dir }
}

